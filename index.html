<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11. Sınıf Müfredat Takibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0f13;--surface:#16181f;--surface2:#1e2029;
    --border:#2a2d38;--text:#e8eaf0;--muted:#6b7080;--faint:#3a3d4a;
    --mat:#f0a500;--fiz:#3d9bff;--kim:#4ecb71;--bio:#b07eff;
    --ok:#4ecb71;--err:#ff5f5f;--r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;min-height:100vh}
  h1,h2,h3,h4,.logo,.tab-btn,.unit-lbl,.q-num,.badge,.btn,.score-badge{font-family:'Syne',sans-serif}

  /* ── LAYOUT ── */
  .app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}

  /* ── SIDEBAR ── */
  .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
  .sb-head{padding:22px 20px 16px;border-bottom:1px solid var(--border)}
  .logo{font-size:17px;font-weight:800;letter-spacing:-.5px;margin-bottom:3px}
  .logo span{color:var(--mat)}
  .sb-sub{font-size:11px;color:var(--muted)}

  /* ── DERS TABS ── */
  .ders-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px}
  .tab-btn{padding:7px 0;border-radius:7px;border:1px solid var(--border);background:transparent;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted);transition:all .15s;text-align:center;letter-spacing:.02em}
  .tab-btn:hover{background:var(--surface2);color:var(--text)}
  .tb-mat.active{background:rgba(240,165,0,.12);border-color:var(--mat);color:var(--mat)}
  .tb-fiz.active{background:rgba(61,155,255,.12);border-color:var(--fiz);color:var(--fiz)}
  .tb-kim.active{background:rgba(78,203,113,.12);border-color:var(--kim);color:var(--kim)}
  .tb-bio.active{background:rgba(176,126,255,.12);border-color:var(--bio);color:var(--bio)}

  /* ── PROGRESS ── */
  .prog-wrap{padding:0 12px 10px;border-bottom:1px solid var(--border)}
  .prog-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
  .prog-pct{font-weight:700;font-size:12px}
  .prog-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
  .prog-fill{height:3px;border-radius:2px;transition:width .4s ease}
  .pf-mat{background:var(--mat)}.pf-fiz{background:var(--fiz)}.pf-kim{background:var(--kim)}.pf-bio{background:var(--bio)}

  /* ── KONU LİST ── */
  .konu-list{flex:1;overflow-y:auto;padding:4px 0 16px;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
  .konu-list::-webkit-scrollbar{width:3px}
  .konu-list::-webkit-scrollbar-thumb{background:var(--faint);border-radius:2px}
  .unit-lbl{padding:10px 14px 4px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .krow{display:flex;align-items:flex-start;gap:9px;padding:7px 14px;cursor:pointer;transition:background .1s;border-radius:0}
  .krow:hover{background:var(--surface2)}
  .krow.sel{background:var(--surface2)}
  .kchk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .2s;color:transparent}
  .kchk.d-mat{background:var(--mat);border-color:var(--mat);color:#000}
  .kchk.d-fiz{background:var(--fiz);border-color:var(--fiz);color:#000}
  .kchk.d-kim{background:var(--kim);border-color:var(--kim);color:#000}
  .kchk.d-bio{background:var(--bio);border-color:var(--bio);color:#000}
  .kname{font-size:12px;line-height:1.4;color:var(--text)}
  .kname.done{color:var(--muted);text-decoration:line-through}

  /* ── MAIN ── */
  .main{padding:32px 36px;display:flex;flex-direction:column;overflow-y:auto}

  /* ── WELCOME ── */
  .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px}
  .w-icon{font-size:36px;margin-bottom:4px}
  .w-title{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .w-sub{font-size:14px;color:var(--muted);line-height:1.7;max-width:380px}

  /* ── QUIZ ── */
  .quiz-wrap{max-width:620px;width:100%;display:flex;flex-direction:column;gap:16px}
  .quiz-header{padding-bottom:14px;border-bottom:1px solid var(--border)}
  .quiz-bc{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .quiz-konu{font-size:18px;font-weight:700;letter-spacing:-.3px}
  .badge{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .bg-mat{background:rgba(240,165,0,.15);color:var(--mat)}.bg-fiz{background:rgba(61,155,255,.15);color:var(--fiz)}
  .bg-kim{background:rgba(78,203,113,.15);color:var(--kim)}.bg-bio{background:rgba(176,126,255,.15);color:var(--bio)}

  /* ── QUESTION CARD ── */
  .q-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px}
  .q-num{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
  .q-text{font-size:14px;line-height:1.7;margin-bottom:16px}
  .opts{display:flex;flex-direction:column;gap:7px}
  .obtn{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;cursor:pointer;text-align:left;transition:all .12s;line-height:1.45;width:100%;font-family:'DM Sans',sans-serif}
  .obtn:hover:not(:disabled){border-color:var(--faint);background:#252833}
  .obtn:disabled{cursor:default}
  .obtn.correct{border-color:rgba(78,203,113,.5);background:rgba(78,203,113,.08)}
  .obtn.wrong{border-color:rgba(255,95,95,.5);background:rgba(255,95,95,.08)}
  .oltr{width:24px;height:24px;min-width:24px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--surface);color:var(--muted);transition:all .12s;font-family:'Syne',sans-serif}
  .obtn.correct .oltr{background:rgba(78,203,113,.2);border-color:var(--ok);color:var(--ok)}
  .obtn.wrong .oltr{background:rgba(255,95,95,.15);border-color:var(--err);color:var(--err)}
  .ac-box{margin-top:14px;padding:11px 14px;border-radius:9px;font-size:13px;line-height:1.6}
  .ac-ok{background:rgba(78,203,113,.07);color:#6ee09a;border:1px solid rgba(78,203,113,.2)}
  .ac-no{background:rgba(255,95,95,.07);color:#ff8080;border:1px solid rgba(255,95,95,.2)}
  .next-row{display:flex;justify-content:flex-end;margin-top:6px}

  /* ── RESULT ── */
  .result-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:480px;width:100%}
  .r-icon{font-size:40px}
  .r-title{font-size:20px;font-weight:800;letter-spacing:-.4px}
  .score-badge{padding:5px 18px;border-radius:20px;font-size:14px;font-weight:700}
  .sc-pass{background:rgba(78,203,113,.15);color:var(--ok);border:1px solid rgba(78,203,113,.3)}
  .sc-fail{background:rgba(255,95,95,.1);color:var(--err);border:1px solid rgba(255,95,95,.2)}
  .r-sub{font-size:13px;color:var(--muted);line-height:1.65;max-width:360px}
  .r-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}

  /* ── BUTTONS ── */
  .btn{padding:9px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.01em;transition:opacity .15s;border:none}
  .btn:hover{opacity:.85}
  .btn-mat{background:var(--mat);color:#000}.btn-fiz{background:var(--fiz);color:#000}
  .btn-kim{background:var(--kim);color:#000}.btn-bio{background:var(--bio);color:#000}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-ghost:hover{background:var(--surface2);opacity:1}

  /* ── LOADING ── */
  .loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:50px}
  .spin{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin-txt{font-size:13px;color:var(--muted);font-family:'Syne',sans-serif;font-weight:600}

  /* ── NO Q FALLBACK ── */
  .no-q{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center;color:var(--muted);font-size:14px;max-width:480px}

  /* ── PROGRAM ── */
  .program-wrap{display:flex;flex-direction:column;gap:14px;max-width:960px;width:100%}
  .pgw-head{margin-bottom:2px}
  .pgw-head .w-sub{text-align:left;margin:4px 0 0;max-width:none}
  .pg-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .15s}
  .pg-card.current{border-color:var(--mat)}
  .pg-card.done{opacity:.6}
  .pg-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px}
  .pg-gun{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
  .pg-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(240,165,0,.15);color:var(--mat);letter-spacing:.04em}
  .pg-prog{font-size:11px;color:var(--muted);font-weight:700;font-family:'Syne',sans-serif;white-space:nowrap}
  .pg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .pg-ders-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;margin-bottom:6px;font-family:'Syne',sans-serif}
  .pgl-mat{color:var(--mat)}.pgl-fiz{color:var(--fiz)}.pgl-kim{color:var(--kim)}.pgl-bio{color:var(--bio)}
  .pg-item{display:flex;align-items:flex-start;gap:7px;padding:4px 6px;margin:0 -6px;cursor:pointer;font-size:12px;line-height:1.4;color:var(--text);border-radius:6px;transition:background .1s}
  .pg-item:hover{background:var(--surface2)}
  .pg-item.done{color:var(--muted);text-decoration:line-through}
  .pg-chk{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--faint);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:8px;color:transparent}
  .pg-chk.d-mat{border-color:var(--mat)}.pg-chk.d-fiz{border-color:var(--fiz)}.pg-chk.d-kim{border-color:var(--kim)}.pg-chk.d-bio{border-color:var(--bio)}
  .pg-item.done .pg-chk.d-mat{background:var(--mat);color:#000}
  .pg-item.done .pg-chk.d-fiz{background:var(--fiz);color:#000}
  .pg-item.done .pg-chk.d-kim{background:var(--kim);color:#000}
  .pg-item.done .pg-chk.d-bio{background:var(--bio);color:#000}
  .program-btn{width:100%;font-size:12px;padding:9px 0;margin-top:2px}

  /* ── ÖZET ── */
  .oz-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
  .oz-title{font-family:'Syne',sans-serif;font-weight:800;font-size:13px;margin-bottom:10px}
  .oz-table{width:100%;font-size:12px;border-collapse:collapse}
  .oz-table td{padding:6px 4px;text-align:right}
  .oz-table td:first-child{text-align:left}
  .oz-head td{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .oz-row{border-top:1px solid var(--border)}
  .oz-total{border-top:1px solid var(--faint);font-weight:700;font-family:'Syne',sans-serif}
  .oz-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;font-family:'Syne',sans-serif}
  .oz-mat{background:rgba(240,165,0,.15);color:var(--mat)}
  .oz-fiz{background:rgba(61,155,255,.15);color:var(--fiz)}
  .oz-kim{background:rgba(78,203,113,.15);color:var(--kim)}
  .oz-bio{background:rgba(176,126,255,.15);color:var(--bio)}

  /* ── ÇALIŞMA NOTLARI ── */
  .not-section{border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
  .not-baslik{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;margin-bottom:8px}
  .not-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;background:var(--surface2);border-radius:8px;margin-bottom:6px}
  .not-item-main{display:flex;align-items:center;gap:8px;min-width:0}
  .not-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0;font-family:'Syne',sans-serif}
  .nb-mat{background:rgba(240,165,0,.15);color:var(--mat)}
  .nb-fiz{background:rgba(61,155,255,.15);color:var(--fiz)}
  .nb-kim{background:rgba(78,203,113,.15);color:var(--kim)}
  .nb-bio{background:rgba(176,126,255,.15);color:var(--bio)}
  .not-item-txt{min-width:0}
  .not-kaynak{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .not-detay{font-size:11px;color:var(--muted)}
  .not-sil{cursor:pointer;color:var(--muted);font-size:13px;flex-shrink:0;transition:color .15s}
  .not-sil:hover{color:var(--err)}
  .not-form{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .not-form-row{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
  .not-form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .not-form input,.not-form select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 9px;font-size:12px;font-family:'DM Sans',sans-serif;width:100%}
  .not-form input::placeholder{color:var(--muted)}
  .not-form select{cursor:pointer}
  .not-form .btn{font-size:12px;padding:8px 0}

  @media(max-width:680px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .sidebar{height:auto;position:static;max-height:320px}
    .konu-list{max-height:200px}
    .main{padding:20px 16px}
    .pg-grid{grid-template-columns:1fr 1fr}
    .not-form-grid{grid-template-columns:repeat(2,1fr)}
    .oz-table{font-size:11px}
  }
</style>
</head>
<body>
<div class="app">

<!-- ══ SIDEBAR ══════════════════════════════════════════════════════════ -->
<aside class="sidebar">
  <div class="sb-head">
    <div class="logo">11. Sınıf <span>Takip</span></div>
    <div class="sb-sub">Konu seç → Test çöz → Tik al</div>
  </div>
  <div class="ders-tabs" id="ders-tabs"></div>
  <div style="padding:0 10px 10px">
    <button class="btn btn-mat program-btn" onclick="renderProgram()">📅 15 Günlük Program</button>
  </div>
  <div class="prog-wrap">
    <div class="prog-row"><span id="prog-lbl">0 / 0 tamamlandı</span><span class="prog-pct" id="prog-pct">%0</span></div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="konu-list" id="konu-list"></div>
</aside>


<!-- ══ MAIN ═════════════════════════════════════════════════════════════ -->
<main class="main" id="main"></main>

</div>

<script>

<script src="questions.js"></script>
<script>
// ── MÜFREDAT YAPISI ──────────────────────────────────────────────────────
const DERSLER = {
  mat:{ad:"Matematik",kisa:"MAT",c:"mat",uniteler:[
    {ad:"Trigonometri",konular:["Yönlü Açılar ve Esas Ölçü","Trigonometrik Fonksiyonlar (sin, cos, tan, cot)","Birim Çember ve Trigonometrik Değerler","Trigonometrik Özdeşlikler","Toplam-Fark Formülleri","İki Kat Açı Formülleri","Kosinüs Teoremi ve Üçgende Trigonometri","Trigonometrik Denklemler","Ters Trigonometrik Fonksiyonlar","Trigonometrik Fonksiyonların Grafikleri"]},
    {ad:"Fonksiyonlarda Uygulamalar",konular:["Fonksiyonlarda Tanım Kümesi, Artan-Azalanlık ve Ekstremum","Fonksiyonlarda Tek-Çift Simetri","Fonksiyonlarda Dönüşümler","Bileşke Fonksiyon","Ters Fonksiyon","İkinci Dereceden Fonksiyonlar ve Grafikleri (Parabol)","Üstel Fonksiyon ve Grafiği","Logaritma Fonksiyonu ve Grafiği","Üstel ve Logaritmik Denklemler","Üstel ve Logaritmik Eşitsizlikler"]},
    {ad:"Denklem ve Eşitsizlik Sistemleri",konular:["Parametreli Denklemler","Mutlak Değer İçeren Denklem ve Eşitsizlikler","Doğrusal Denklem Sistemleri","İkinci Dereceden İki Bilinmeyenli Denklem Sistemleri","Doğrusal Olmayan Denklem Sistemleri","Eşitsizlik Sistemleri"]},
    {ad:"Analitik Geometri",konular:["Koordinat Sisteminde Nokta ve Doğru","İki Nokta Arasındaki Uzaklık","Noktanın Doğruya Uzaklığı","Doğruların Paralelliği ve Dikliği","İki Doğru Arasındaki Açı","Modüler Aritmetik ve İşlemler","Çemberin Analitik İncelenmesi","Çembere Teğet Doğrular","İki Çemberin Birbirine Göre Konumu"]},
    {ad:"Çember ve Daire",konular:["Çemberde Açılar (Merkez, Çevre, İç-Dış)","Çemberde Kiriş ve Bağıntılar","Çembere Çizilen Teğet","Çevrel Çember ve İç Teğet Çember","Daire Dilimi ve Yay Uzunluğu"]},
    {ad:"Uzay Geometri",konular:["Uzayda Doğru ve Düzlem İlişkileri","Prizmalar (Yüzey Alanı ve Hacim)","Piramitler (Yüzey Alanı ve Hacim)","Silindir (Yüzey Alanı ve Hacim)","Koni (Yüzey Alanı ve Hacim)","Küre (Yüzey Alanı ve Hacim)","Katı Cisimlerin Kesitleri"]},
    {ad:"Olasılık",konular:["Olaylar ve Olay Çeşitleri","Klasik Olasılık Tanımı","Toplama Kuralı","Çarpma Kuralı","Koşullu Olasılık","Bağımsız ve Bağımlı Olaylar","Deneysel ve Teorik Olasılık"]},
  ]},
  fiz:{ad:"Fizik",kisa:"FİZ",c:"fiz",uniteler:[
    {ad:"Kuvvet ve Hareket",konular:["Vektörler","Bağıl Hareket","Newton'ın Hareket Yasaları","Bir Boyutta Sabit İvmeli Hareket","Serbest Düşme","Limit Hız","Düşey Doğrultuda Atış Hareketi","İki Boyutta Hareket (Eğik Atış)","Dairesel Hareket","Basit Harmonik Hareket","Tork (Kuvvet Momenti)","Statik Denge","İş-Enerji Teoremi","Mekanik Enerjinin Korunumu","Sürtünmeli Yüzeylerde Enerji","İtme ve Çizgisel Momentum","Momentumun Korunumu","Çarpışmalar (Elastik ve İnelastik)","Basit Makineler"]},
    {ad:"Elektrik ve Manyetizma",konular:["Elektriksel Kuvvet ve Coulomb Yasası","Noktasal Yük Elektrik Alanı","Elektrik Alan Çizgileri","Elektriksel Potansiyel Enerji","Elektriksel Potansiyel Fark","Sığa ve Kondansatörler","Elektrik Akımı ve Devre Elemanları","Ohm Yasası","Seri ve Paralel Devreler","Kirchhoff Yasaları","Elektrik Enerjisi ve Güç","Manyetik Alan","Manyetik Kuvvet (Lorentz)","Elektromanyetik İndüksiyon","Faraday Yasası","Alternatif Akım Temel Kavramlar","Transformatörler"]},
  ]},
  kim:{ad:"Kimya",kisa:"KİM",c:"kim",uniteler:[

// ── 15 GÜNLÜK PROGRAM ───────────────────────────────────────────────────
function gunDurumu(gun){
  let tot=0, don=0;
  Object.entries(gun.konular).forEach(([d,list]) => {
    list.forEach(({u,k}) => { tot++; if(tamamlananlar[key(d,u,k)]) don++; });
  });
  return {tot, don};
}

function renderProgram(){
  let tamGun=0, ilkEksik=null;
  const durumlar = PROGRAM.map(g => {
    const d = gunDurumu(g);
    const tam = d.tot>0 && d.don===d.tot;
    if(tam) tamGun++;
    else if(ilkEksik===null) ilkEksik = g.gun;
    return {g, d, tam};
  });

  const cards = durumlar.map(({g,d,tam}) => {
    const dersHtml = Object.entries(g.konular).map(([ders,list]) => {
      const items = list.map(({u,k}) => {
        const ok = !!tamamlananlar[key(ders,u,k)];
        const uEsc = u.replace(/'/g,"\\'"), kEsc = k.replace(/'/g,"\\'");
        return `<div class="pg-item${ok?' done':''}" onclick="gotoKonu('${ders}','${uEsc}','${kEsc}')">
          <span class="pg-chk d-${ders}">${ok?'✓':''}</span><span>${k}</span>
        </div>`;
      }).join("");
      return `<div>
        <div class="pg-ders-lbl pgl-${ders}">${DERSLER[ders].kisa}</div>
        ${items}
      </div>`;
    }).join("");

    return `<div class="pg-card${g.gun===ilkEksik?' current':''}${tam?' done':''}">
      <div class="pg-head">
        <div class="pg-gun">Gün ${g.gun}${g.gun===ilkEksik?'<span class="pg-tag">SIRADAKİ</span>':''}${tam?'<span class="pg-tag" style="background:rgba(78,203,113,.15);color:var(--ok)">✓ TAMAMLANDI</span>':''}</div>
        <div class="pg-prog">${d.don} / ${d.tot} konu</div>
      </div>
      <div class="pg-grid">${dersHtml}</div>
      ${renderNotlar(g.gun)}
    </div>`;
  }).join("");

  document.getElementById("main").innerHTML = `
    <div class="program-wrap">
      <div class="pgw-head">
        <h2 class="w-title">📅 15 Günlük Program</h2>
        <p class="w-sub">${tamGun} / ${PROGRAM.length} gün tamamlandı${ilkEksik?` · Sıradaki: Gün ${ilkEksik}`:' · Tüm program bitti 🎉'}. Bir konuya tıkla, 2 soru çöz, tamamla.</p>
      </div>
      ${renderOzet()}
      ${cards}
    </div>`;
}

function gotoKonu(d,u,k){
  aktif = d;
  startQuiz(u,k);
}

  const yanlis = +document.getElementById(`nf-yanlis-${gun}`).value || 0;
  const bos = +document.getElementById(`nf-bos-${gun}`).value || 0;
  if(!kaynak && !test && !soru && !dogru && !yanlis && !bos) return;
  if(!notlar[gun]) notlar[gun] = [];
  notlar[gun].push({ders, konu, kaynak, test, soru, dogru, yanlis, bos});
  notlarKaydet();
  renderProgram();
}

function notSil(gun, idx){
  notlar[gun].splice(idx,1);
  if(notlar[gun].length===0) delete notlar[gun];
  notlarKaydet();
  renderProgram();
}

function ozetHesapla(){
  const t = {mat:{test:0,soru:0,dogru:0,yanlis:0,bos:0}, fiz:{test:0,soru:0,dogru:0,yanlis:0,bos:0},
             kim:{test:0,soru:0,dogru:0,yanlis:0,bos:0}, bio:{test:0,soru:0,dogru:0,yanlis:0,bos:0}};
  Object.values(notlar).forEach(list => (list||[]).forEach(n => {
    const x = t[n.ders]; if(!x) return;
    x.test+=n.test; x.soru+=n.soru; x.dogru+=n.dogru; x.yanlis+=n.yanlis; x.bos+=n.bos;
  }));
  return t;
}

function renderOzet(){
  const t = ozetHesapla();
  const dersler = ["mat","fiz","kim","bio"];
  const genel = {test:0,soru:0,dogru:0,yanlis:0,bos:0};
  const rows = dersler.map(d => {
    const x = t[d];
    const has = x.test||x.soru||x.dogru||x.yanlis||x.bos;
    genel.test+=x.test; genel.soru+=x.soru; genel.dogru+=x.dogru; genel.yanlis+=x.yanlis; genel.bos+=x.bos;
    const net = (x.dogru - x.yanlis/4).toFixed(2);
    return `<tr class="oz-row">
      <td><span class="oz-badge oz-${d}">${DERSLER[d].kisa}</span></td>
      <td>${has?x.test:'—'}</td>
      <td>${has?x.soru:'—'}</td>
      <td>${has?`${x.dogru} / ${x.yanlis} / ${x.bos}`:'— / — / —'}</td>
      <td>${has?net:'—'}</td>
    </tr>`;
  }).join("");
  const genelNet = (genel.dogru - genel.yanlis/4).toFixed(2);
  return `<div class="oz-card">
    <div class="oz-title">📊 Genel Özet</div>
    <table class="oz-table">
      <tr class="oz-head"><td>Ders</td><td>Test</td><td>Soru</td><td>D / Y / B</td><td>Net</td></tr>
      ${rows}
      <tr class="oz-total"><td>Toplam</td><td>${genel.test}</td><td>${genel.soru}</td><td>${genel.dogru} / ${genel.yanlis} / ${genel.bos}</td><td>${genelNet}</td></tr>
    </table>
  </div>`;
}

function renderNotlar(gun){
  const list = notlar[gun] || [];
  const items = list.map((n,idx) => {
    const ust = n.kaynak && n.konu ? `${n.kaynak} · ${n.konu}` : (n.kaynak || n.konu || "—");
    return `<div class="not-item">
      <div class="not-item-main">
        <span class="not-badge nb-${n.ders}">${DERSLER[n.ders].kisa}</span>
        <div class="not-item-txt">
          <div class="not-kaynak">${ust}</div>
          <div class="not-detay">${n.test} test · ${n.soru} soru · ${n.dogru}D ${n.yanlis}Y ${n.bos}B</div>
        </div>
      </div>
      <span class="not-sil" onclick="notSil(${gun},${idx})">🗑</span>
    </div>`;
  }).join("");

  return `<div class="not-section">
    <div class="not-baslik">📝 Çalışma notların</div>
    ${items}
    <div class="not-form">
      <div class="not-form-row">
        <select id="nf-ders-${gun}" onchange="notFormDersDegis(${gun})">
          <option value="mat">Matematik</option>
          <option value="fiz">Fizik</option>
          <option value="kim">Kimya</option>
          <option value="bio">Biyoloji</option>
        </select>
        <select id="nf-konu-${gun}">${notKonuOptions(gun,'mat')}</select>
      </div>
      <input id="nf-kaynak-${gun}" type="text" placeholder="Kaynak adı (örn. Orijinal 11)">
      <div class="not-form-grid">
        <input id="nf-test-${gun}" type="number" min="0" placeholder="Test">
        <input id="nf-soru-${gun}" type="number" min="0" placeholder="Soru">
        <input id="nf-dogru-${gun}" type="number" min="0" placeholder="Doğru">
        <input id="nf-yanlis-${gun}" type="number" min="0" placeholder="Yanlış">
        <input id="nf-bos-${gun}" type="number" min="0" placeholder="Boş">
        <button class="btn btn-mat" onclick="notEkle(${gun})">+ Ekle</button>
      </div>
    </div>
  </div>`;
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────
function renderSidebar(){
  const D = DERSLER[aktif];
  document.getElementById("ders-tabs").innerHTML = Object.entries(DERSLER).map(([id,d])=>
    `<button class="tab-btn tb-${id}${id===aktif?' active':''}" onclick="switchDers('${id}')">${d.kisa}</button>`
  ).join("");

  let tot=0, don=0;
  D.uniteler.forEach(u => u.konular.forEach(k => { tot++; if(tamamlananlar[key(aktif,u.ad,k)]) don++; }));
  const pct = tot ? Math.round(don/tot*100) : 0;
  document.getElementById("prog-lbl").textContent = `${don} / ${tot} tamamlandı`;
  document.getElementById("prog-pct").textContent = "%" + pct;
  const pf = document.getElementById("prog-fill");
  pf.style.width = pct + "%";
  pf.className = `prog-fill pf-${aktif}`;

  const kl = document.getElementById("konu-list");
  kl.innerHTML = "";
  D.uniteler.forEach(u => {
    const lbl = document.createElement("div");
    lbl.className = "unit-lbl"; lbl.textContent = u.ad; kl.appendChild(lbl);
    u.konular.forEach(k => {
      const done = !!tamamlananlar[key(aktif,u.ad,k)];
      const sel = selUnite===u.ad && selKonu===k;
      const row = document.createElement("div");
      row.className = "krow" + (sel?" sel":"");
      row.onclick = () => startQuiz(u.ad, k);
      const chk = document.createElement("div");
      chk.className = "kchk" + (done ? " d-"+aktif : "");
      chk.textContent = done ? "✓" : "";
      const nm = document.createElement("div");
      nm.className = "kname" + (done ? " done" : "");
      nm.textContent = k;
      row.appendChild(chk); row.appendChild(nm); kl.appendChild(row);
    });
  });
}

function switchDers(d){ aktif=d; selKonu=null; selUnite=null; renderSidebar(); showWelcome(); }

function showWelcome(){
  document.getElementById("main").innerHTML = `
    <div class="welcome">
      <div class="w-icon">📚</div>
      <h2 class="w-title">${DERSLER[aktif].ad}</h2>
      <p class="w-sub">Sol taraftan bir konuya tıkla. 2 soru çıkacak — ikisini de doğru yaparsan konu tamamlanır.</p>
    </div>`;
}

// ── QUIZ ──────────────────────────────────────────────────────────────────
function startQuiz(unite, konu){
  selUnite=unite; selKonu=konu; cevaplar=[];
  renderSidebar();

  // Soruları QUESTIONS objesinden al
  const qKey = key(aktif, unite, konu);
  const havuz = (typeof QUESTIONS !== "undefined" && QUESTIONS[qKey]) ? QUESTIONS[qKey] : null;

  if(!havuz || havuz.length < 2){
    // Bu konu için soru yoksa bilgi ver
    document.getElementById("main").innerHTML = `
      <div class="quiz-wrap">
        <div class="quiz-header">
          <div class="quiz-bc">${DERSLER[aktif].ad} / ${unite}</div>
          <div class="quiz-konu">${konu}</div>
        </div>
        <div class="no-q">
          Bu konu için henüz soru eklenmemiş.<br>
          <small style="margin-top:6px;display:block;opacity:.6">Yakında eklenecek.</small>
        </div>
      </div>`;
    return;
  }

  // Havuzdan rastgele 2 soru seç
  const shuffled = [...havuz].sort(() => Math.random() - 0.5);
  sorular = shuffled.slice(0, 2);
  renderSoru(0);
}

function renderSoru(idx){
  if(idx >= sorular.length){ showSonuc(); return; }
  const s = sorular[idx];
  const H = ["A","B","C","D"];
  document.getElementById("main").innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-header">
        <div class="quiz-bc">${DERSLER[aktif].ad} / ${selUnite}</div>
        <div class="quiz-konu">${selKonu}</div>
        <span class="badge bg-${aktif}">${idx+1} / ${sorular.length}</span>
      </div>
      <div class="q-card" id="qcard">
        <div class="q-num">Soru ${idx+1}</div>
        <div class="q-text">${s.soru}</div>
        <div class="opts">
          ${H.map(h=>`<button class="obtn" id="ob${h}" onclick="cevapla('${h}',${idx})">
            <span class="oltr">${h}</span><span>${s.siklar[h]||''}</span>
          </button>`).join("")}
        </div>
      </div>
    </div>`;
}

function cevapla(sec, idx){
  const s = sorular[idx];
  ["A","B","C","D"].forEach(h=>{
    const b = document.getElementById("ob"+h);
    if(!b) return;
    b.disabled = true;
    if(h===s.dogru) b.classList.add("correct");
    else if(h===sec && sec!==s.dogru) b.classList.add("wrong");
  });
  cevaplar.push({sec, dogru:s.dogru, ok:sec===s.dogru});

  const card = document.getElementById("qcard");
  const ac = document.createElement("div");
  ac.className = "ac-box " + (sec===s.dogru?"ac-ok":"ac-no");
  ac.innerHTML = sec===s.dogru
    ? `<strong>✓ Doğru!</strong> ${s.aciklama}`
    : `<strong>✗ Yanlış.</strong> Doğru cevap: <strong>${s.dogru}</strong>. ${s.aciklama}`;
  card.appendChild(ac);

  const qw = document.querySelector(".quiz-wrap");
  const nr = document.createElement("div");
  nr.className = "next-row";
  nr.innerHTML = `<button class="btn btn-${aktif}" onclick="renderSoru(${idx+1})">
    ${idx+1<sorular.length ? "Sonraki soru →" : "Sonucu gör →"}
  </button>`;
  qw.appendChild(nr);
}

function showSonuc(){
  const dogru = cevaplar.filter(c=>c.ok).length;
  const gecti = dogru === sorular.length;
  if(gecti){ tamamlananlar[key(aktif,selUnite,selKonu)]=true; kaydet(); renderSidebar(); }

  document.getElementById("main").innerHTML = `
    <div class="result-card">
      <div class="r-icon">${gecti?"🎉":"📖"}</div>
      <h2 class="r-title">${gecti?"Tebrikler!":"Henüz değil…"}</h2>
      <div class="score-badge ${gecti?"sc-pass":"sc-fail"}">${dogru} / ${sorular.length} doğru</div>
      <p class="r-sub">${gecti
        ? `"<strong>${selKonu}</strong>" konusu tamamlandı ve işaretlendi.`
        : `2/2 tam doğru yapman gerekiyor. Konuyu tekrar çalış ve dene.`}</p>
      <div class="r-btns">
        ${!gecti?`<button class="btn btn-${aktif}" onclick="startQuiz('${selUnite.replace(/'/g,"\\'")}','${selKonu.replace(/'/g,"\\'")}')">Tekrar dene</button>`:""}
        <button class="btn btn-ghost" onclick="showWelcome();selKonu=null;selUnite=null;renderSidebar()">Konulara dön</button>
        <button class="btn btn-ghost" onclick="renderProgram()">📅 Programa dön</button>
      </div>
    </div>`;
}

// ── INIT ─────────────────────────────────────────────────────────────────
switchDers("mat");
</script>
</body>
</html>
